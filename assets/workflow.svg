<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1217" viewBox="0 0 1140 1217" role="img" aria-labelledby="workflow-title workflow-description">
<title id="workflow-title">Manim Algorithm Animation Maker — 工作流程與責任分工</title>
<desc id="workflow-description">左側 Stage 索引欄，中間 Main Agent / User，右側 Sub-Agent。節點位置表示執行者，形狀與色彩表示工作類型。五階段依序為教學設計、教學腳本、旁白製作、場景實作與驗證、渲染與交付。深色實線表示通過後前進，細紅色虛線回到負責修正的節點。每個 Sub-Agent 節點在左上角標明角色。</desc>
<defs>
 <marker id="success-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9Z" fill="#34465d"/></marker>
 <marker id="failure-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9Z" fill="#b78380"/></marker>
</defs>
<style>
 text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif; fill:#26364a; }
 .node-title { font-size:17px; font-weight:500; }
 .node-shape { stroke-width:1.2; }
 .production .node-shape { fill:#eef5fd; stroke:#91accb; }
 .review .node-shape { fill:#f3eff9; stroke:#ab99c1; }
 .approval .node-shape,.terminal .node-shape { fill:#edf6ef; stroke:#8eaf98; }
 .owner-label { font-size:11px; fill:#69788b; }
 .agent-badge rect { fill:#ffffff; stroke:#c5cfdd; stroke-width:.8; }
 .badge-title { font-size:9px; fill:#53667e; }
 .lane-title { font-size:18px; font-weight:500; fill:#44556b; }
 .stage-title { font-size:14px; font-weight:500; fill:#687587; }
 .stage-number { font-size:12px; fill:#8a95a4; letter-spacing:1px; }
 .stage-rule { stroke:#e6ebf1; stroke-width:1; }
 .edge { fill:none; stroke-linejoin:round; stroke-linecap:round; }
 .success { stroke:#34465d; stroke-width:2.4; }
 .failure { stroke:#b78380; stroke-width:1.15; stroke-dasharray:5 5; }
 .edge-label { font-size:11px; fill:#58735f; paint-order:stroke; stroke:#ffffff; stroke-width:4px; stroke-linejoin:round; }
 .failure-label { fill:#a46f6b; }
 .legend-label { font-size:12px; fill:#6d798a; }
</style>
<rect id="canvas" width="1140" height="1217" fill="#ffffff"/>
<g id="stage-index-column">
 <rect x="16" y="58" width="180" height="1097" fill="#fafbfd"/>
 <text x="106" y="34" class="stage-title" text-anchor="middle">Stage</text>
 <path d="M196 58 V1155" fill="none" stroke="#dce3ec" stroke-width="1"/>
</g>
<g id="workflow-content" transform="translate(180 0)">
<g id="ownership-lanes">
 <g id="main-user-area"><rect x="16" y="58" width="464" height="1097" fill="#fcfdfe"/><text x="260" y="34" class="lane-title" text-anchor="middle">Main Agent / User</text></g>
 <g id="sub-agent-area"><rect x="480" y="58" width="464" height="1097" fill="#f8fafc"/><text x="700" y="34" class="lane-title" text-anchor="middle">Sub-Agent</text></g>
 <path d="M480 58 V1155" fill="none" stroke="#dce3ec" stroke-width="1"/>
</g>
<g id="stages">
<g id="stage-01"><path class="stage-rule" d="M -164 58 H 944"/>
<text x="-74" y="86" class="stage-number" text-anchor="middle">01</text>
<text x="-74" y="110" class="stage-title" text-anchor="middle">教學設計</text>
</g>
<g id="stage-02"><path class="stage-rule" d="M -164 388.63 H 944"/>
<text x="-74" y="412.63" class="stage-number" text-anchor="middle">02</text>
<text x="-74" y="432.63" class="stage-title" text-anchor="middle">教學腳本</text>
</g>
<g id="stage-03"><path class="stage-rule" d="M -164 583.02 H 944"/>
<text x="-74" y="607.02" class="stage-number" text-anchor="middle">03</text>
<text x="-74" y="627.02" class="stage-title" text-anchor="middle">旁白製作</text>
</g>
<g id="stage-04"><path class="stage-rule" d="M -164 686.74 H 944"/>
<text x="-74" y="710.74" class="stage-number" text-anchor="middle">04</text>
<text x="-74" y="730.74" class="stage-title" text-anchor="middle">場景實作與驗證</text>
</g>
<g id="stage-05"><path class="stage-rule" d="M -164 962.02 H 944"/>
<text x="-74" y="986.02" class="stage-number" text-anchor="middle">05</text>
<text x="-74" y="1006.02" class="stage-title" text-anchor="middle">渲染與交付</text>
</g>
</g><g id="feedback-loops">
<path id="review-design-fail" data-from="design-review" data-to="animation-design" class="edge failure" d="M 700 164 V 152.33 H 360 V 164" marker-end="url(#failure-arrow)"/>
<text x="535" y="147.67" class="edge-label failure-label" text-anchor="middle">FAIL</text>
<path id="user-design-revise" data-from="design-approval" data-to="animation-design" class="edge failure" d="M 110 320 H 70 V 200 H 110" marker-end="url(#failure-arrow)"/>
<text x="70" y="261.85" class="edge-label failure-label" text-anchor="middle">調整</text>
<path id="script-fail" data-from="script-reviewer" data-to="script-writer" class="edge failure" d="M 850 526 H 910 V 440 H 850" marker-end="url(#failure-arrow)"/>
<text x="910" y="484.45" class="edge-label failure-label" text-anchor="middle">FAIL</text>
<path id="voice-fail" data-from="audio-gate" data-to="voice-generator" class="edge failure" d="M 260 601 V 594.3 H 660 V 601" marker-end="url(#failure-arrow)"/>
<text x="460" y="591.86" class="edge-label failure-label" text-anchor="middle">FAIL</text>
<path id="layout-fail" data-from="layout-validator" data-to="scene-writer" class="edge failure" d="M 850 819 H 890 V 733 H 850" marker-end="url(#failure-arrow)"/>
<text x="890" y="779.14" class="edge-label failure-label" text-anchor="middle">FAIL</text>
<path id="contract-fail" data-from="scene-reviewer" data-to="scene-writer" class="edge failure" d="M 850 905 H 930 V 733 H 850" marker-end="url(#failure-arrow)"/>
<text x="930" y="867.31" class="edge-label failure-label" text-anchor="middle">FAIL</text>
<path id="delivery-fail" data-from="delivery-gate" data-to="final-renderer" class="edge failure" d="M 260 980 V 958 H 660 V 980" marker-end="url(#failure-arrow)"/>
<text x="460" y="950" class="edge-label failure-label" text-anchor="middle">FAIL</text>
</g><g id="success-flow">
<path id="request-design" data-from="request" data-to="animation-design" class="edge success" d="M 260 136 V 164" marker-end="url(#success-arrow)"/>
<path id="design-to-review" data-from="animation-design" data-to="design-review" class="edge success" d="M 410 200 H 550" marker-end="url(#success-arrow)"/>
<path id="review-user-pass" data-from="design-review" data-to="design-approval" class="edge success" d="M 700 236 V 256.92 H 260 V 268" marker-end="url(#success-arrow)"/>
<path id="approved-script" data-from="design-approval" data-to="script-writer" class="edge success" d="M 410 320 H 470 V 440 H 550" marker-end="url(#success-arrow)"/>
<text x="438" y="312" class="edge-label" text-anchor="middle">核准</text>
<path id="script-review" data-from="script-writer" data-to="script-reviewer" class="edge success" d="M 700 476 V 490" marker-end="url(#success-arrow)"/>
<path id="script-pass" data-from="script-reviewer" data-to="voice-generator" class="edge success" d="M 700 562 V 601" marker-end="url(#success-arrow)"/>
<path id="voice-check" data-from="voice-generator" data-to="audio-gate" class="edge success" d="M 550 637 H 410" marker-end="url(#success-arrow)"/>
<path id="voice-pass" data-from="audio-gate" data-to="scene-writer" class="edge success" d="M 260 673 V 733 H 550" marker-end="url(#success-arrow)"/>
<path id="writer-layout" data-from="scene-writer" data-to="layout-validator" class="edge success" d="M 700 769 V 783" marker-end="url(#success-arrow)"/>
<path id="layout-review" data-from="layout-validator" data-to="scene-reviewer" class="edge success" d="M 700 855 V 869" marker-end="url(#success-arrow)"/>
<path id="contract-pass" data-from="scene-reviewer" data-to="final-renderer" class="edge success" d="M 700 941 V 980" marker-end="url(#success-arrow)"/>
<path id="render-delivery" data-from="final-renderer" data-to="delivery-gate" class="edge success" d="M 550 1016 H 410" marker-end="url(#success-arrow)"/>
<path id="delivery-pass" data-from="delivery-gate" data-to="final-video" class="edge success" d="M 260 1052 V 1071" marker-end="url(#success-arrow)"/>
</g><g id="nodes">
<g id="request" class="node terminal" data-owner="main-user" data-cx="260" data-cy="100"><title>使用者的演算法需求 — User</title>
<rect class="node-shape" x="110" y="64" width="300" height="72" rx="36"/>
<text x="140" y="86" class="owner-label" text-anchor="start">User</text>
<text x="260" y="115" class="node-title" text-anchor="middle">使用者的演算法需求</text>
</g>
<g id="animation-design" class="node production" data-owner="main-user" data-cx="260" data-cy="200"><title>確認教學需求並規劃五幕動畫 — Main Agent + User</title>
<desc>包含需求確認、完整五幕設計與複雜度範圍的使用者確認。</desc>
<rect class="node-shape" x="110" y="164" width="300" height="72" rx="4"/>
<text x="140" y="186" class="owner-label" text-anchor="start">Main Agent + User</text>
<text x="260" y="215" class="node-title" text-anchor="middle">確認教學需求並規劃五幕動畫</text>
</g>
<g id="design-review" class="node review" data-owner="sub-agent" data-cx="700" data-cy="200"><title>審查教學內容與動畫設計 — animation_design_reviewer</title>
<path class="node-shape" d="M 568 164 H 832 L 850 200 L 832 236 H 568 L 550 200 Z"/>
<g class="agent-badge"><rect x="574" y="174" width="62" height="16" rx="3"/>
<text x="605" y="186" class="badge-title" text-anchor="middle">Sub-Agent</text>
<text x="644" y="186" class="owner-label" text-anchor="start">animation_design_reviewer</text>
</g>
<text x="700" y="215" class="node-title" text-anchor="middle">審查教學內容與動畫設計</text>
</g>
<g id="design-approval" class="node approval" data-owner="main-user" data-cx="260" data-cy="320"><title>使用者確認完整五幕設計 — User</title>
<path class="node-shape" d="M 260 268 L 410 320 L 260 372 L 110 320 Z"/>
<text x="240" y="298" class="owner-label" text-anchor="start">User</text>
<text x="260" y="326" class="node-title" text-anchor="middle">使用者確認完整五幕設計</text>
</g>
<g id="script-writer" class="node production" data-owner="sub-agent" data-cx="700" data-cy="440"><title>撰寫逐幕教學腳本 — script_writer</title>
<rect class="node-shape" x="550" y="404" width="300" height="72" rx="4"/>
<g class="agent-badge"><rect x="574" y="414" width="62" height="16" rx="3"/>
<text x="605" y="426" class="badge-title" text-anchor="middle">Sub-Agent</text>
<text x="644" y="426" class="owner-label" text-anchor="start">script_writer</text>
</g>
<text x="700" y="455" class="node-title" text-anchor="middle">撰寫逐幕教學腳本</text>
</g>
<g id="script-reviewer" class="node review" data-owner="sub-agent" data-cx="700" data-cy="526"><title>審查教學內容與講解順序 — script_reviewer</title>
<path class="node-shape" d="M 568 490 H 832 L 850 526 L 832 562 H 568 L 550 526 Z"/>
<g class="agent-badge"><rect x="574" y="500" width="62" height="16" rx="3"/>
<text x="605" y="512" class="badge-title" text-anchor="middle">Sub-Agent</text>
<text x="644" y="512" class="owner-label" text-anchor="start">script_reviewer</text>
</g>
<text x="700" y="541" class="node-title" text-anchor="middle">審查教學內容與講解順序</text>
</g>
<g id="voice-generator" class="node production" data-owner="sub-agent" data-cx="700" data-cy="637"><title>產生逐段旁白與語音 — voiceover_generator</title>
<rect class="node-shape" x="550" y="601" width="300" height="72" rx="4"/>
<g class="agent-badge"><rect x="574" y="611" width="62" height="16" rx="3"/>
<text x="605" y="623" class="badge-title" text-anchor="middle">Sub-Agent</text>
<text x="644" y="623" class="owner-label" text-anchor="start">voiceover_generator</text>
</g>
<text x="700" y="652" class="node-title" text-anchor="middle">產生逐段旁白與語音</text>
</g>
<g id="audio-gate" class="node review" data-owner="main-user" data-cx="260" data-cy="637"><title>檢查旁白覆蓋與音檔完整性 — Main Agent</title>
<path class="node-shape" d="M 128 601 H 392 L 410 637 L 392 673 H 128 L 110 637 Z"/>
<text x="140" y="623" class="owner-label" text-anchor="start">Main Agent</text>
<text x="260" y="652" class="node-title" text-anchor="middle">檢查旁白覆蓋與音檔完整性</text>
</g>
<g id="scene-writer" class="node production" data-owner="sub-agent" data-cx="700" data-cy="733"><title>依教學腳本撰寫 Manim 場景程式碼 — scene_writer</title>
<rect class="node-shape" x="550" y="697" width="300" height="72" rx="4"/>
<g class="agent-badge"><rect x="574" y="707" width="62" height="16" rx="3"/>
<text x="605" y="719" class="badge-title" text-anchor="middle">Sub-Agent</text>
<text x="644" y="719" class="owner-label" text-anchor="start">scene_writer</text>
</g>
<text x="700" y="740" class="node-title" text-anchor="middle"><tspan x="700" y="740">依教學腳本撰寫 </tspan><tspan x="700" y="761">Manim 場景程式碼</tspan></text>
</g>
<g id="layout-validator" class="node review" data-owner="sub-agent" data-cx="700" data-cy="819"><title>正式渲染前檢查畫面版面 — scene_layout_validator</title>
<path class="node-shape" d="M 568 783 H 832 L 850 819 L 832 855 H 568 L 550 819 Z"/>
<g class="agent-badge"><rect x="574" y="793" width="62" height="16" rx="3"/>
<text x="605" y="805" class="badge-title" text-anchor="middle">Sub-Agent</text>
<text x="644" y="805" class="owner-label" text-anchor="start">scene_layout_validator</text>
</g>
<text x="700" y="834" class="node-title" text-anchor="middle">正式渲染前檢查畫面版面</text>
</g>
<g id="scene-reviewer" class="node review" data-owner="sub-agent" data-cx="700" data-cy="905"><title>檢查場景是否符合設計與腳本 — scene_reviewer</title>
<path class="node-shape" d="M 568 869 H 832 L 850 905 L 832 941 H 568 L 550 905 Z"/>
<g class="agent-badge"><rect x="574" y="879" width="62" height="16" rx="3"/>
<text x="605" y="891" class="badge-title" text-anchor="middle">Sub-Agent</text>
<text x="644" y="891" class="owner-label" text-anchor="start">scene_reviewer</text>
</g>
<text x="700" y="920" class="node-title" text-anchor="middle">檢查場景是否符合設計與腳本</text>
</g>
<g id="final-renderer" class="node production" data-owner="sub-agent" data-cx="700" data-cy="1016"><title>渲染五個場景並合併影片 — scene_final_renderer</title>
<rect class="node-shape" x="550" y="980" width="300" height="72" rx="4"/>
<g class="agent-badge"><rect x="574" y="990" width="62" height="16" rx="3"/>
<text x="605" y="1002" class="badge-title" text-anchor="middle">Sub-Agent</text>
<text x="644" y="1002" class="owner-label" text-anchor="start">scene_final_renderer</text>
</g>
<text x="700" y="1031" class="node-title" text-anchor="middle">渲染五個場景並合併影片</text>
</g>
<g id="delivery-gate" class="node review" data-owner="main-user" data-cx="260" data-cy="1016"><title>檢查影片規格與播放完整性 — Main Agent</title>
<path class="node-shape" d="M 128 980 H 392 L 410 1016 L 392 1052 H 128 L 110 1016 Z"/>
<text x="140" y="1002" class="owner-label" text-anchor="start">Main Agent</text>
<text x="260" y="1031" class="node-title" text-anchor="middle">檢查影片規格與播放完整性</text>
</g>
<g id="final-video" class="node terminal" data-owner="main-user" data-cx="260" data-cy="1107"><title>完整 Manim 演算法教學影片 — User</title>
<rect class="node-shape" x="110" y="1071" width="300" height="72" rx="36"/>
<text x="140" y="1093" class="owner-label" text-anchor="start">User</text>
<text x="260" y="1122" class="node-title" text-anchor="middle">完整 Manim 演算法教學影片</text>
</g>
</g>
<g id="legend" transform="translate(34 1188)">
 <rect x="0" y="-10" width="25" height="18" rx="2" fill="#eef5fd" stroke="#91accb"/><text x="34" y="4" class="legend-label">製作</text>
 <path d="M103 -10 H123 L129 -1 L123 8 H103 L97 -1Z" fill="#f3eff9" stroke="#ab99c1"/><text x="138" y="4" class="legend-label">審查／驗證</text>
 <path d="M270 -13 L287 -1 L270 11 L253 -1Z" fill="#edf6ef" stroke="#8eaf98"/><text x="296" y="4" class="legend-label">使用者核准</text>
 <path d="M408 -1 H445" class="edge success" marker-end="url(#success-arrow)"/><text x="454" y="4" class="legend-label">通過後前進</text>
 <path d="M575 -1 H612" class="edge failure" marker-end="url(#failure-arrow)"/><text x="621" y="4" class="legend-label">回修</text>
 <g class="agent-badge"><rect x="692" y="-11" width="62" height="16" rx="3"/><text x="723" y="1" class="badge-title" text-anchor="middle">Sub-Agent</text></g><text x="764" y="4" class="legend-label">Sub-Agent 執行</text>
</g>
</g>
</svg>
