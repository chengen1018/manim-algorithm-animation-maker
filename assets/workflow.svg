<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1137" viewBox="0 0 1080 1137" role="img" aria-labelledby="workflow-title workflow-description">
<title id="workflow-title">Manim Algorithm Animation Maker — 工作流程與責任分工</title>
<desc id="workflow-description">左側 Stage 索引欄，中間 Main Agent / User，右側 Sub-Agent。節點位置表示執行者，形狀與色彩表示工作類型。五階段依序為教學設計、教學腳本、旁白製作、場景實作與驗證、渲染與交付。深色實線表示通過後前進，細紅色虛線回到負責修正的節點。每個 Sub-Agent 節點在左上角標明角色。</desc>
<defs>
 <marker id="success-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9Z" fill="#34465d"/></marker>
 <marker id="failure-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9Z" fill="#b78380"/></marker>
</defs>
<style>
 text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif; fill:#26364a; }
 .node-title { font-size:17px; font-weight:500; }
 .node-shape { stroke-width:1.2; }
 .production .node-shape { fill:#eef5fd; stroke:#91accb; }
 .review .node-shape { fill:#f3eff9; stroke:#ab99c1; }
 .approval .node-shape,.terminal .node-shape { fill:#edf6ef; stroke:#8eaf98; }
 .owner-label { font-size:11px; fill:#69788b; }
 .agent-badge rect { fill:#ffffff; stroke:#c5cfdd; stroke-width:.8; }
 .badge-title { font-size:9px; fill:#53667e; }
 .lane-title { font-size:18px; font-weight:500; fill:#44556b; }
 .stage-title { font-size:14px; font-weight:500; fill:#687587; }
 .stage-number { font-size:12px; fill:#8a95a4; letter-spacing:1px; }
 .stage-rule { stroke:#e6ebf1; stroke-width:1; }
 .edge { fill:none; stroke-linejoin:round; stroke-linecap:round; }
 .success { stroke:#34465d; stroke-width:2.4; }
 .failure { stroke:#b78380; stroke-width:1.15; stroke-dasharray:5 5; }
 .edge-label { font-size:11px; fill:#58735f; paint-order:stroke; stroke:#ffffff; stroke-width:4px; stroke-linejoin:round; }
 .failure-label { fill:#a46f6b; }
 .legend-label { font-size:12px; fill:#6d798a; }
</style>
<rect id="canvas" width="1080" height="1137" fill="#ffffff"/>
<g id="stage-index-column">
 <rect x="16" y="58" width="120" height="1017" fill="#fafbfd"/>
 <text x="76" y="34" class="stage-title" text-anchor="middle">Stage</text>
 <path d="M136 58 V1075" fill="none" stroke="#dce3ec" stroke-width="1"/>
</g>
<g id="workflow-content" transform="translate(120 0)">
<g id="ownership-lanes">
 <g id="main-user-area"><rect x="16" y="58" width="464" height="1017" fill="#fcfdfe"/><text x="260" y="34" class="lane-title" text-anchor="middle">Main Agent / User</text></g>
 <g id="sub-agent-area"><rect x="480" y="58" width="464" height="1017" fill="#f8fafc"/><text x="700" y="34" class="lane-title" text-anchor="middle">Sub-Agent</text></g>
 <path d="M480 58 V1075" fill="none" stroke="#dce3ec" stroke-width="1"/>
</g>
<g id="stages">
<g id="stage-01"><path class="stage-rule" d="M -104 58 H 944"/>
<text x="-44" y="87.56" class="stage-number" text-anchor="middle">01</text>
<text x="-44" y="108.89" class="stage-title" text-anchor="middle">教學設計</text>
</g>
<g id="stage-02"><path class="stage-rule" d="M -104 368.63 H 944"/>
<text x="-44" y="392.63" class="stage-number" text-anchor="middle">02</text>
<text x="-44" y="412.63" class="stage-title" text-anchor="middle">教學腳本</text>
</g>
<g id="stage-03"><path class="stage-rule" d="M -104 547.02 H 944"/>
<text x="-44" y="571.02" class="stage-number" text-anchor="middle">03</text>
<text x="-44" y="591.02" class="stage-title" text-anchor="middle">旁白製作</text>
</g>
<g id="stage-04"><path class="stage-rule" d="M -104 642.74 H 944"/>
<text x="-44" y="666.74" class="stage-number" text-anchor="middle">04</text>
<text x="-44" y="686.74" class="stage-title" text-anchor="middle">場景實作與驗證</text>
</g>
<g id="stage-05"><path class="stage-rule" d="M -104 894.02 H 944"/>
<text x="-44" y="918.02" class="stage-number" text-anchor="middle">05</text>
<text x="-44" y="938.02" class="stage-title" text-anchor="middle">渲染與交付</text>
</g>
</g><g id="feedback-loops">
<path id="review-design-fail" data-from="design-review" data-to="animation-design" class="edge failure" d="M 700 160 V 148.33 H 360 V 160" marker-end="url(#failure-arrow)"/>
<text x="535" y="143.67" class="edge-label failure-label" text-anchor="middle">FAIL</text>
<path id="user-design-revise" data-from="design-approval" data-to="animation-design" class="edge failure" d="M 110 304 H 70 V 192 H 110" marker-end="url(#failure-arrow)"/>
<text x="70" y="249.85" class="edge-label failure-label" text-anchor="middle">調整</text>
<path id="script-fail" data-from="script-reviewer" data-to="script-writer" class="edge failure" d="M 850 494 H 910 V 416 H 850" marker-end="url(#failure-arrow)"/>
<text x="910" y="456.45" class="edge-label failure-label" text-anchor="middle">FAIL</text>
<path id="voice-fail" data-from="audio-gate" data-to="voice-generator" class="edge failure" d="M 260 565 V 558.3 H 660 V 565" marker-end="url(#failure-arrow)"/>
<text x="460" y="555.86" class="edge-label failure-label" text-anchor="middle">FAIL</text>
<path id="layout-fail" data-from="layout-validator" data-to="scene-writer" class="edge failure" d="M 850 763 H 890 V 685 H 850" marker-end="url(#failure-arrow)"/>
<text x="890" y="727.14" class="edge-label failure-label" text-anchor="middle">FAIL</text>
<path id="contract-fail" data-from="scene-reviewer" data-to="scene-writer" class="edge failure" d="M 850 841 H 930 V 685 H 850" marker-end="url(#failure-arrow)"/>
<text x="930" y="807.31" class="edge-label failure-label" text-anchor="middle">FAIL</text>
<path id="delivery-fail" data-from="delivery-gate" data-to="final-renderer" class="edge failure" d="M 260 912 V 890 H 660 V 912" marker-end="url(#failure-arrow)"/>
<text x="460" y="882" class="edge-label failure-label" text-anchor="middle">FAIL</text>
</g><g id="success-flow">
<path id="request-design" data-from="request" data-to="animation-design" class="edge success" d="M 260 132 V 160" marker-end="url(#success-arrow)"/>
<path id="design-to-review" data-from="animation-design" data-to="design-review" class="edge success" d="M 410 192 H 550" marker-end="url(#success-arrow)"/>
<path id="review-user-pass" data-from="design-review" data-to="design-approval" class="edge success" d="M 700 224 V 244.92 H 260 V 256" marker-end="url(#success-arrow)"/>
<path id="approved-script" data-from="design-approval" data-to="script-writer" class="edge success" d="M 410 304 H 700 V 384" marker-end="url(#success-arrow)"/>
<text x="438" y="296.62" class="edge-label" text-anchor="middle">核准</text>
<path id="script-review" data-from="script-writer" data-to="script-reviewer" class="edge success" d="M 700 448 V 462" marker-end="url(#success-arrow)"/>
<path id="script-pass" data-from="script-reviewer" data-to="voice-generator" class="edge success" d="M 700 526 V 565" marker-end="url(#success-arrow)"/>
<path id="voice-check" data-from="voice-generator" data-to="audio-gate" class="edge success" d="M 550 597 H 410" marker-end="url(#success-arrow)"/>
<path id="voice-pass" data-from="audio-gate" data-to="scene-writer" class="edge success" d="M 260 629 V 685 H 550" marker-end="url(#success-arrow)"/>
<path id="writer-layout" data-from="scene-writer" data-to="layout-validator" class="edge success" d="M 700 717 V 731" marker-end="url(#success-arrow)"/>
<path id="layout-review" data-from="layout-validator" data-to="scene-reviewer" class="edge success" d="M 700 795 V 809" marker-end="url(#success-arrow)"/>
<path id="contract-pass" data-from="scene-reviewer" data-to="final-renderer" class="edge success" d="M 700 873 V 912" marker-end="url(#success-arrow)"/>
<path id="render-delivery" data-from="final-renderer" data-to="delivery-gate" class="edge success" d="M 550 944 H 410" marker-end="url(#success-arrow)"/>
<path id="delivery-pass" data-from="delivery-gate" data-to="final-video" class="edge success" d="M 260 976 V 995" marker-end="url(#success-arrow)"/>
</g><g id="nodes">
<g id="request" class="node terminal" data-owner="main-user" data-cx="260" data-cy="100"><title>使用者的演算法需求 — User</title>
<rect class="node-shape" x="110" y="68" width="300" height="64" rx="36"/>
<text x="140" y="87.56" class="owner-label" text-anchor="start">User</text>
<text x="260" y="113.33" class="node-title" text-anchor="middle">使用者的演算法需求</text>
</g>
<g id="animation-design" class="node production" data-owner="main-user" data-cx="260" data-cy="192"><title>確認教學需求並規劃五幕動畫 — Main Agent + User</title>
<desc>包含需求確認、完整五幕設計與複雜度範圍的使用者確認。</desc>
<rect class="node-shape" x="110" y="160" width="300" height="64" rx="4"/>
<text x="140" y="179.56" class="owner-label" text-anchor="start">Main Agent + User</text>
<text x="260" y="205.33" class="node-title" text-anchor="middle">確認教學需求並規劃五幕動畫</text>
</g>
<g id="design-review" class="node review" data-owner="sub-agent" data-cx="700" data-cy="192"><title>審查教學內容與動畫設計 — animation_design_reviewer</title>
<path class="node-shape" d="M 568 160 H 832 L 850 192 L 832 224 H 568 L 550 192 Z"/>
<g class="agent-badge"><rect x="574" y="168.89" width="62" height="16" rx="3"/>
<text x="605" y="179.56" class="badge-title" text-anchor="middle">Sub-Agent</text>
<text x="644" y="179.56" class="owner-label" text-anchor="start">animation_design_reviewer</text>
</g>
<text x="700" y="205.33" class="node-title" text-anchor="middle">審查教學內容與動畫設計</text>
</g>
<g id="design-approval" class="node approval" data-owner="main-user" data-cx="260" data-cy="304"><title>使用者確認完整五幕設計 — User</title>
<path class="node-shape" d="M 260 256 L 410 304 L 260 352 L 110 304 Z"/>
<text x="240" y="283.69" class="owner-label" text-anchor="start">User</text>
<text x="260" y="309.54" class="node-title" text-anchor="middle">使用者確認完整五幕設計</text>
</g>
<g id="script-writer" class="node production" data-owner="sub-agent" data-cx="700" data-cy="416"><title>撰寫逐幕教學腳本 — script_writer</title>
<rect class="node-shape" x="550" y="384" width="300" height="64" rx="4"/>
<g class="agent-badge"><rect x="574" y="392.89" width="62" height="16" rx="3"/>
<text x="605" y="403.56" class="badge-title" text-anchor="middle">Sub-Agent</text>
<text x="644" y="403.56" class="owner-label" text-anchor="start">script_writer</text>
</g>
<text x="700" y="429.33" class="node-title" text-anchor="middle">撰寫逐幕教學腳本</text>
</g>
<g id="script-reviewer" class="node review" data-owner="sub-agent" data-cx="700" data-cy="494"><title>審查教學內容與講解順序 — script_reviewer</title>
<path class="node-shape" d="M 568 462 H 832 L 850 494 L 832 526 H 568 L 550 494 Z"/>
<g class="agent-badge"><rect x="574" y="470.89" width="62" height="16" rx="3"/>
<text x="605" y="481.56" class="badge-title" text-anchor="middle">Sub-Agent</text>
<text x="644" y="481.56" class="owner-label" text-anchor="start">script_reviewer</text>
</g>
<text x="700" y="507.33" class="node-title" text-anchor="middle">審查教學內容與講解順序</text>
</g>
<g id="voice-generator" class="node production" data-owner="sub-agent" data-cx="700" data-cy="597"><title>產生逐段旁白與語音 — voiceover_generator</title>
<rect class="node-shape" x="550" y="565" width="300" height="64" rx="4"/>
<g class="agent-badge"><rect x="574" y="573.89" width="62" height="16" rx="3"/>
<text x="605" y="584.56" class="badge-title" text-anchor="middle">Sub-Agent</text>
<text x="644" y="584.56" class="owner-label" text-anchor="start">voiceover_generator</text>
</g>
<text x="700" y="610.33" class="node-title" text-anchor="middle">產生逐段旁白與語音</text>
</g>
<g id="audio-gate" class="node review" data-owner="main-user" data-cx="260" data-cy="597"><title>檢查旁白覆蓋與音檔完整性 — Main Agent</title>
<path class="node-shape" d="M 128 565 H 392 L 410 597 L 392 629 H 128 L 110 597 Z"/>
<text x="140" y="584.56" class="owner-label" text-anchor="start">Main Agent</text>
<text x="260" y="610.33" class="node-title" text-anchor="middle">檢查旁白覆蓋與音檔完整性</text>
</g>
<g id="scene-writer" class="node production" data-owner="sub-agent" data-cx="700" data-cy="685"><title>依教學腳本撰寫 Manim 場景程式碼 — scene_writer</title>
<rect class="node-shape" x="550" y="653" width="300" height="64" rx="4"/>
<g class="agent-badge"><rect x="574" y="661.89" width="62" height="16" rx="3"/>
<text x="605" y="672.56" class="badge-title" text-anchor="middle">Sub-Agent</text>
<text x="644" y="672.56" class="owner-label" text-anchor="start">scene_writer</text>
</g>
<text x="700" y="691.22" class="node-title" text-anchor="middle"><tspan x="700" y="691.22">依教學腳本撰寫 </tspan><tspan x="700" y="709.89">Manim 場景程式碼</tspan></text>
</g>
<g id="layout-validator" class="node review" data-owner="sub-agent" data-cx="700" data-cy="763"><title>正式渲染前檢查畫面版面 — scene_layout_validator</title>
<path class="node-shape" d="M 568 731 H 832 L 850 763 L 832 795 H 568 L 550 763 Z"/>
<g class="agent-badge"><rect x="574" y="739.89" width="62" height="16" rx="3"/>
<text x="605" y="750.56" class="badge-title" text-anchor="middle">Sub-Agent</text>
<text x="644" y="750.56" class="owner-label" text-anchor="start">scene_layout_validator</text>
</g>
<text x="700" y="776.33" class="node-title" text-anchor="middle">正式渲染前檢查畫面版面</text>
</g>
<g id="scene-reviewer" class="node review" data-owner="sub-agent" data-cx="700" data-cy="841"><title>檢查場景是否符合設計與腳本 — scene_reviewer</title>
<path class="node-shape" d="M 568 809 H 832 L 850 841 L 832 873 H 568 L 550 841 Z"/>
<g class="agent-badge"><rect x="574" y="817.89" width="62" height="16" rx="3"/>
<text x="605" y="828.56" class="badge-title" text-anchor="middle">Sub-Agent</text>
<text x="644" y="828.56" class="owner-label" text-anchor="start">scene_reviewer</text>
</g>
<text x="700" y="854.33" class="node-title" text-anchor="middle">檢查場景是否符合設計與腳本</text>
</g>
<g id="final-renderer" class="node production" data-owner="sub-agent" data-cx="700" data-cy="944"><title>渲染五個場景並合併影片 — scene_final_renderer</title>
<rect class="node-shape" x="550" y="912" width="300" height="64" rx="4"/>
<g class="agent-badge"><rect x="574" y="920.89" width="62" height="16" rx="3"/>
<text x="605" y="931.56" class="badge-title" text-anchor="middle">Sub-Agent</text>
<text x="644" y="931.56" class="owner-label" text-anchor="start">scene_final_renderer</text>
</g>
<text x="700" y="957.33" class="node-title" text-anchor="middle">渲染五個場景並合併影片</text>
</g>
<g id="delivery-gate" class="node review" data-owner="main-user" data-cx="260" data-cy="944"><title>檢查影片規格與播放完整性 — Main Agent</title>
<path class="node-shape" d="M 128 912 H 392 L 410 944 L 392 976 H 128 L 110 944 Z"/>
<text x="140" y="931.56" class="owner-label" text-anchor="start">Main Agent</text>
<text x="260" y="957.33" class="node-title" text-anchor="middle">檢查影片規格與播放完整性</text>
</g>
<g id="final-video" class="node terminal" data-owner="main-user" data-cx="260" data-cy="1027"><title>完整 Manim 演算法教學影片 — User</title>
<rect class="node-shape" x="110" y="995" width="300" height="64" rx="36"/>
<text x="140" y="1014.56" class="owner-label" text-anchor="start">User</text>
<text x="260" y="1040.33" class="node-title" text-anchor="middle">完整 Manim 演算法教學影片</text>
</g>
</g>
<g id="legend" transform="translate(34 1108)">
 <rect x="0" y="-10" width="25" height="18" rx="2" fill="#eef5fd" stroke="#91accb"/><text x="34" y="4" class="legend-label">製作</text>
 <path d="M103 -10 H123 L129 -1 L123 8 H103 L97 -1Z" fill="#f3eff9" stroke="#ab99c1"/><text x="138" y="4" class="legend-label">審查／驗證</text>
 <path d="M270 -13 L287 -1 L270 11 L253 -1Z" fill="#edf6ef" stroke="#8eaf98"/><text x="296" y="4" class="legend-label">使用者核准</text>
 <path d="M408 -1 H445" class="edge success" marker-end="url(#success-arrow)"/><text x="454" y="4" class="legend-label">通過後前進</text>
 <path d="M575 -1 H612" class="edge failure" marker-end="url(#failure-arrow)"/><text x="621" y="4" class="legend-label">回修</text>
 <g class="agent-badge"><rect x="692" y="-11" width="62" height="16" rx="3"/><text x="723" y="1" class="badge-title" text-anchor="middle">Sub-Agent</text></g><text x="764" y="4" class="legend-label">Sub-Agent 執行</text>
</g>
</g>
</svg>
